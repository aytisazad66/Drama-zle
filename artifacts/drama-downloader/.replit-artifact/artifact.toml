kind = "mobile"
previewPath = "/"
title = "Drama Downloader"
version = "1.0.0"
id = "artifacts/drama-downloader"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25426

[services.development]
run = "pnpm --filter @workspace/drama-downloader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/drama-downloader", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/drama-downloader", "run", "serve" ]

[services.env]
PORT = "25426"
BASE_PATH = "/"
